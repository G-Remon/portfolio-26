    <meta

    <!-- =====================================================

    <meta

    <meta name="author" content="Gerges Remon" />
    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"

    <!-- =====================================================

    ====================================================== -->
    <meta

    />

    />

    <!-- =====================================================

    ====================================================== -->

    />

    <meta

    <meta

      content="https://gergis-portfolio.vercel.app/"
    />

    <meta
      property="og:title"

    />

    <meta

    <meta

    />

    <!-- =====================================================
         STRUCTURED DATA
    ====================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gerges Remon",
        "url": "https://gergis-portfolio.vercel.app/",
        "jobTitle": "Digital Solutions & Creative Technology Specialist",
        "sameAs": [
          "https://github.com/G-Remon",
          "https://www.linkedin.com/in/gerges-remon-2625000n/"
        ]
      }
    </script>

    <!-- =====================================================
         THEME INITIALIZATION
         Runs before React to prevent theme flashing
    ====================================================== -->
    <script>
      (() => {
        const LIGHT_THEME_COLOR = "#F6F7F8";
        const DARK_THEME_COLOR = "#0B1118";

        try {
          const storedTheme = localStorage.getItem("theme");
          const systemPrefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

          const theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : systemPrefersDark
                ? "dark"
                : "light";

          const root = document.documentElement;

          root.dataset.theme = theme;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;

          document
            .querySelector("#theme-color-meta")
            ?.setAttribute(
              "content",
              theme === "dark"
                ? DARK_THEME_COLOR
                : LIGHT_THEME_COLOR
            );
        } catch {
          /*
           * If localStorage is unavailable,
           * the website still renders normally.
           */
        }
      })();
    </script>
  </head>

  <body>
    <noscript>
      This portfolio requires JavaScript to provide the full experience.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
